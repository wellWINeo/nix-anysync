name: Test NixOS VM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nixos-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Configure public binary cache
        id: cache-config
        shell: bash
        env:
          NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
          NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ -n "$NIX_CACHE_URL" && -z "$NIX_CACHE_PUBLIC_KEY" ]] || [[ -z "$NIX_CACHE_URL" && -n "$NIX_CACHE_PUBLIC_KEY" ]]; then
            echo "::error::Configure both NIX_CACHE_URL and NIX_CACHE_PUBLIC_KEY, or leave both unset"
            exit 1
          fi
          if [[ "$NIX_CACHE_URL" == *$'\n'* || "$NIX_CACHE_PUBLIC_KEY" == *$'\n'* ]]; then
            echo "::error::Nix cache URL and public key must each be a single line"
            exit 1
          fi
          {
            echo "extra_nix_config<<NIX_CONFIG_EOF"
            if [[ -n "$NIX_CACHE_URL" ]]; then
              echo "substituters = https://cache.nixos.org $NIX_CACHE_URL"
              echo "trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= $NIX_CACHE_PUBLIC_KEY"
            fi
            echo "NIX_CONFIG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ steps.cache-config.outputs.extra_nix_config }}

      - name: Verify KVM availability
        run: bash scripts/verify-kvm.sh

      - name: Build NixOS VM test
        run: nix build --show-trace --print-build-logs .#checks.x86_64-linux.any-sync-test
