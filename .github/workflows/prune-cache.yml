name: Retain binary cache

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      destructive:
        description: Enable metadata withdrawal and eligible NAR deletion
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: cache-prune
    permissions:
      contents: read
      id-token: write
    env:
      CACHE_BUCKET: ${{ vars.NIX_CACHE_BUCKET }}
      CACHE_PRUNE_ENABLED: ${{ vars.CACHE_PRUNE_ENABLED }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: ${{ vars.CACHE_WRITER_ROLE_ARN }}
          aws-region: ${{ vars.NIX_CACHE_REGION }}

      - name: Run cache retention
        shell: bash
        env:
          MANUAL_DESTRUCTIVE: ${{ inputs.destructive }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_DESTRUCTIVE" == "true" && "$CACHE_PRUNE_ENABLED" == "true" ]]; then
            args+=(--execute)
          else
            echo "Cache cleanup is dry-run; destructive mode requires manual approval and CACHE_PRUNE_ENABLED=true."
          fi
          python3 scripts/cache-retention.py prune "${args[@]}"
