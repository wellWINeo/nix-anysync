name: Update Any-Sync packages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    name: Update Any-Sync stack
    runs-on: ubuntu-latest
    concurrency:
      group: update-any-sync-stack
      cancel-in-progress: false
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GIT_AUTHOR_NAME: ${{ vars.PACKAGE_UPDATE_AUTHOR_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.PACKAGE_UPDATE_AUTHOR_EMAIL }}
      GIT_COMMITTER_NAME: ${{ vars.PACKAGE_UPDATE_AUTHOR_NAME }}
      GIT_COMMITTER_EMAIL: ${{ vars.PACKAGE_UPDATE_AUTHOR_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve update scripts from the default branch
        run: |
          mkdir -p "$RUNNER_TEMP/package-update"
          cp scripts/{find-update-branch,prepare-update-branch,update-package,update-packages,push-update-branch}.sh \
            "$RUNNER_TEMP/package-update/"

      - name: Find existing update PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/package-update/find-update-branch.sh"

      - name: Prepare update branch
        env:
          PR_OPEN: ${{ steps.existing-pr.outputs.open }}
        run: bash "$RUNNER_TEMP/package-update/prepare-update-branch.sh" "$BASE_BRANCH" "$UPDATE_BRANCH" "$PR_OPEN"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update packages
        id: update
        run: bash "$RUNNER_TEMP/package-update/update-packages.sh"

      - name: Commit package updates
        if: steps.update.outputs.changed == 'true'
        run: |
          if [[ -z "$GIT_AUTHOR_NAME" || -z "$GIT_AUTHOR_EMAIL" ]]; then
            echo '::error::Set PACKAGE_UPDATE_AUTHOR_NAME and PACKAGE_UPDATE_AUTHOR_EMAIL repository variables.'
            exit 1
          fi
          git add -- pkgs/any-sync/any-sync-{consensus,coordinator,filenode,node,tools}.nix
          git commit -m 'Update Any-Sync stack'

      - name: Check whether a push is needed
        id: push
        env:
          PR_OPEN: ${{ steps.existing-pr.outputs.open }}
          CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          if [[ "$PR_OPEN" == true ]]; then
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$UPDATE_BRANCH")" ]]; then
              echo 'needed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'needed=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "needed=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        if: steps.push.outputs.needed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PACKAGE_UPDATE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push updates and create PR
        if: steps.push.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_OPEN: ${{ steps.existing-pr.outputs.open }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          bash "$RUNNER_TEMP/package-update/push-update-branch.sh"
